# Secret scanning configuration, used by `gitleaks git .` before a push.
#
# The default ruleset applies in full. Each allowlist below records one
# measured false positive so that a real finding is never the third line of a
# report nobody reads any more. Matched by the reported value only: with a
# `paths` entry, gitleaks 8.30.1 exempted every finding in that file, whatever
# the regex or `condition` said (measured with a planted key).

[extend]
useDefault = true

[[allowlists]]
description = """
The bundled protocol definition lists, in a comment, which APIs each property
exists in: "available for: wattpilot, go-eCharger-API-v1, go-eCharger-API-v2".
The generic-api-key rule reads the token after that colon as a key. Verified
by reading the line: it is documentation in a vendored YAML file, not a
credential.
"""
regexes = ['''go-eCharger-API-v[12]''']

[[allowlists]]
description = """
A diagnostics test feeds a property named "newKey" holding a made-up
Wattpilot host name; the generic-api-key rule reads the name as a key and
the host name as its value. Verified by reading the line: the serial in it
is synthetic.
"""
regexes = ['''^Wattpilot-91234567$''']
