name: CI

# A pull request is what gets a branch tested: it names the ref under review
# and is the one run to wait for before the merge. Pushes to main cover the
# merge commit itself, and workflow_call lets the release workflow demand
# these same jobs for the tagged commit -- a tag push alone never triggers a
# branch filter. `branches` and `branches-ignore` must never both appear on
# one event: GitHub then rejects the whole file and nothing runs at all.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install --group dev
      - name: Run all gates (same script as local)
        run: bash scripts/check.sh

  # The `check` job above runs whatever Home Assistant is newest. That says
  # nothing about the oldest one we let HACS install on, and the difference is
  # not academic: DeviceEntry only gained `config_entry_id` in 2026.8.0, so
  # every action raised AttributeError on the version hacs.json used to
  # declare -- with a fully green suite. Keep this pin equal to hacs.json's
  # "homeassistant" (tests/test_guards.py enforces that). The
  # pytest-homeassistant-custom-component release pins one HA version each,
  # so a mismatched pair fails here in pip rather than silently in a user's
  # install.
  minimum-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the declared minimum Home Assistant
        run: |
          pip install --group dev \
            "homeassistant==2026.8.0" \
            "pytest-homeassistant-custom-component==0.13.354"
      - name: Run the test suite against it
        run: python3 -m pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  # TEMPORARY: why does CI kill an accepted survivor that survives locally?
  mutant-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --group dev
      - name: Full mutation run, then the two accepted survivors alone, all output kept
        run: |
          set -x
          nproc
          mutmut run 2>&1 | tail -c 200000
          mutmut results --all true | grep -v killed
          mutmut run custom_components.wattpilot.hub.xǁWattpilotHubǁasync_connect__mutmut_1 2>&1 | tail -c 200000
          mutmut results --all true | grep -v killed
      - name: The same mutant under raw pytest, exit code kept
        run: |
          mutmut tests-for-mutant custom_components.wattpilot.hub.xǁWattpilotHubǁasync_connect__mutmut_1 | grep '::' > /tmp/tests.txt
          wc -l /tmp/tests.txt
          cd mutants
          MUTANT_UNDER_TEST=custom_components.wattpilot.hub.xǁWattpilotHubǁasync_connect__mutmut_1 python -m pytest -x -q --rootdir=. -p no:randomly $(cat /tmp/tests.txt) ; echo "raw-exit=$?"
